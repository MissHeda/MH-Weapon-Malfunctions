name = "MH Weapon Malfunctions"
prefix = "mhwm"
author = "Miss Heda"
mainprefix = "z"

[files]
include = [
    "mod.cpp",
    "README.md",
    "CHANGELOG.md",
]

[version]
git_hash = 0

[hemtt.config]
preset = "Hemtt"

# Default test set: with ACE, to see the ACE Overheating hand-over.
[hemtt.launch.default]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "3499977893", # Advanced Developer Tools
]

# With the test mission in Eden: hemtt launch test
[hemtt.launch.test]
extends = "default"
mission = "MHWM_Test.VR"
parameters = ["-window", "-noPause", "-showScriptErrors", "-name=MHWMTest"]

# Without ACE: hemtt launch vanilla
[hemtt.launch.vanilla]
workshop = [
    "450814997",  # CBA_A3
    "3499977893", # Advanced Developer Tools
]
